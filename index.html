<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130b0c">
<meta name="color-scheme" content="dark">
<meta name="description" content="花信 · 手势粒子花园：一朵由摄像头手势驱动的粒子玫瑰，握拳收拢，张开时散作星野。">
<title>花信 · 手势粒子花园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23130b0c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e4788f'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #f6ece7;
    --dim: #b9a6a0;
    --accent: #e4788f;
    --bg: #130b0c;
    --line: rgba(246, 236, 231, .16);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  main { width: 100%; max-width: 560px; }
  .kicker {
    margin: 0 0 14px;
    font-size: 12px;
    letter-spacing: .22em;
    color: var(--dim);
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 18px;
    font-family: "Songti SC", "SimSun", "Source Han Serif SC", serif;
    font-size: clamp(34px, 9vw, 52px);
    font-weight: 500;
    letter-spacing: .04em;
  }
  .lede {
    margin: 0 0 36px;
    font-size: 15px;
    line-height: 1.9;
    color: var(--dim);
    max-width: 30em;
  }
  .card {
    display: block;
    padding: 26px 24px;
    border: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
    transition: border-color .25s ease, background-color .25s ease;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent);
    background: rgba(228, 120, 143, .06);
    outline: none;
  }
  .card h2 {
    margin: 0 0 8px;
    font-family: "Songti SC", "SimSun", "Source Han Serif SC", serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: .06em;
  }
  .card p {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--dim);
  }
  .meta {
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: .06em;
  }
  .meta span { color: var(--ink); }
  footer {
    margin-top: 34px;
    font-size: 12px;
    color: var(--dim);
    line-height: 1.9;
  }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <p class="kicker">手势粒子花园 · 第一卷</p>
  <h1>花信</h1>
  <p class="lede">用摄像头读懂手掌的开合，让一朵粒子玫瑰从花苞走到星野。握拳收拢，张开绽放；不开摄像头也可以用手动控制看完整个形态。</p>

  <a class="card" href="versions/rose/">
    <h2>进入花园</h2>
    <p>一朵玫瑰，四层花瓣，一根花茎。完全张开时外层花瓣散作覆盖画面的星场。</p>
    <div class="meta">
      <div>粒子 <span>13,000</span></div>
      <div>形态 <span>3</span></div>
      <div>依赖 <span>WebGL 2</span></div>
    </div>
  </a>

  <footer>
    源码与创作手记见 <a href="https://github.com/guoyanchao666-bit/particle-flora">仓库</a>。摄像头画面不显示、不上传，只在本地提取手部关键点。
  </footer>
</main>
</body>
</html>
