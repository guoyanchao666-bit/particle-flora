name: Import runtime assets

# 一次性维护工作流：把 vendor/ 与 models/ 实际写入仓库。
# 由本文件首次推送触发；执行完成后可从仓库移除。
on:
  push:
    paths:
      - '.github/workflows/import-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch runtime assets
        run: bash scripts/fetch-assets.sh

      - name: Commit vendor and models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor models
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: 导入运行时资源（vendor/ 与 models/）"
          git push
